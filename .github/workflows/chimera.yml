name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package.
#
# Everything runs here, on games anyone may have: ScummVM's own test engine
# (its data made by tests/make-testbed.py from ScummVM's tree) and
# scummvm.org's freeware games, which tests/fetch-freeware.sh downloads
# (each free to redistribute by its own licence; none is in the
# repository). The test script compares the native reference with the
# sandbox on them, the package is built, Chimera's headless runner and its
# window play a project of the test engine, and the package passes
# Chimera's own package checks. The MT-32 test needs the Roland MT-32's
# ROMs, which no runner has: it says SKIP here.
#
# The job is long. On a cold cache it builds Mesa twice (for the sandbox
# and for the native reference; cached afterwards, keyed by setup-mesa.sh)
# and ScummVM three times (the native reference, the sandbox with the test
# engines, and the published sandbox without them), each about ten minutes
# on four fast cores and longer on a runner.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # 04:00 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run.
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref: the nightly schedule and a push to
# main would otherwise cancel each other, and the publish that depends on the
# cancelled gate is then skipped with nothing reporting a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  gate:
    name: build and test (native against sandbox, the package, Chimera's package checks)
    # Ubuntu 24.04, not ubuntu-latest: on GitHub's 26.04 image GCC builds for
    # x86-64-v3 (AVX2, FMA) by default, so a core built there would not run
    # on an older processor and would round floating point differently
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev bison flex python3-mako python3-packaging

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window)
        run: chimera-checkout/tools/ci-chimera.sh "$HOME/qt"

      - name: Which Meson the runner has
        # a build folder one Meson set up, another cannot read: the runner's
        # Meson changed on 2026-11-12 and every cached miniBox build failed
        id: meson
        run: echo "version=$(meson --version)" >> "$GITHUB_OUTPUT"

      - name: Cache miniBox's sandbox toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-meson${{ steps.meson.outputs.version }}-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (the sandbox, and its C++ toolchain)
        # the C++ toolchain's build of musl's math is what the native
        # reference links (waterbox/make-native-libm.sh)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Cache Mesa (the core's OpenGL, built for the guest and for the runner)
        uses: actions/cache@v4
        with:
          path: |
            build/mesa
            build/deps/mesa-24.0.9.tar.xz
          key: mesa-24.0.9-${{ runner.os }}-${{ hashFiles('waterbox/setup-mesa.sh') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}

      - name: Cache the libraries' release tarballs (waterbox/deps.lock)
        uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ hashFiles('waterbox/deps.lock') }}-mesa-24.0.9

      - name: Build Mesa
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          bash waterbox/setup-mesa.sh -m "$mb" -j 4
          bash waterbox/setup-mesa.sh -n -j 4

      - name: Fetch the freeware games
        run: ./tests/fetch-freeware.sh "$RUNNER_TEMP/freeware"

      - name: Run the test script
        # and every kind of test must have passed, so one that stopped running
        # cannot go unnoticed
        env:
          MINIBOX_DIR: ${{ github.workspace }}/chimera-checkout/extern/chimera-common-minibox
          CHIMERA_ROOT: ${{ github.workspace }}/chimera-checkout
        run: |
          set +e
          ./waterbox/run-gate.sh -m "$MINIBOX_DIR" -g "$RUNNER_TEMP/freeware" > gate.out 2>&1
          rc=$?
          set -e
          grep -v '^miniBox:' gate.out
          [ "$rc" -eq 0 ]
          for t in testbed:formats testbed:saves testbed:files savedata:export savedata:import rerecord session turbo \
                   3d:software 3d:opengl 3d:opengl_shaders 3d:setting 3d:rerecord 3d:session \
                   input:click input:keys input:axes time:virtual time:date refusal:no-game refusal:not-zip \
                   refusal:unknown refusal:method refusal:save refusal:rom sky queen lure drascula dreamweb \
                   texts:keys texts:names; do
            grep -q "^PASS $t:" gate.out || { echo "$t did not pass"; exit 1; }
          done

      - name: Build and install the published package
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead. It has no
        # test engines (build-package.sh without -t).
        env:
          CORE_VERSION: ${{ github.sha }}
          MINIBOX_DIR: ${{ github.workspace }}/chimera-checkout/extern/chimera-common-minibox
        run: ./waterbox/build-package.sh -r chimera-checkout

      - name: Build the test package
        # the same sources with ScummVM's two test engines, which the frontend
        # test plays; never published
        env:
          CORE_VERSION: ${{ github.sha }}
          MINIBOX_DIR: ${{ github.workspace }}/chimera-checkout/extern/chimera-common-minibox
        run: ./waterbox/build-package.sh -t

      - name: Run the frontend test
        # the test package played by chimera-run (a movie file and a project)
        # and by Chimera's window, run headless, each last picture the native
        # reference's
        run: QT_LIB_DIR="$HOME/qt/6.12.0/gcc_64/lib" ./tests/run-frontend.sh --chimera-root chimera-checkout --package build/package-tests/scummvm.chimeraCore

      - name: Check the published package
        # it says it is the release build, refuses the test engines' games,
        # plays Beneath a Steel Sky as the native reference does, and passes
        # Chimera's contract tests
        run: ./tests/check-release.sh --chimera-root chimera-checkout --package chimera-checkout/build/Cores/scummvm.chimeraCore -g "$RUNNER_TEMP/freeware"

      - name: Package contract tests (the test package)
        run: |
          mkdir -p "$RUNNER_TEMP/test-package"
          cp build/package-tests/scummvm.chimeraCore "$RUNNER_TEMP/test-package/"
          CHIMERA_CORES_DIR="$RUNNER_TEMP/test-package" chimera-checkout/build/meson-linux/source/ui/test-packages "$RUNNER_TEMP/test-package"

      - name: Publish the core package
        uses: actions/upload-artifact@v7
        with:
          name: scummvm-${{ github.sha }}
          path: chimera-checkout/build/Cores/scummvm.chimeraCore
          if-no-files-found: error

      - name: Upload the test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            build/gate/
            build/frontend/
            build/release-check/
            build/*.log

  publish:
    # What the gate passed, published as this core's own release: an immutable
    # `nightly-YYYY-MM-DD` from the scheduled run, or from one started by hand.
    # A push to main publishes nothing. The logic is Chimera's tools/publish-
    # core.sh, through the one reusable workflow every core publishes with.
    name: publish
    needs: [ gate ]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: scummvm
      artifact: scummvm-${{ github.sha }}
      package: scummvm.chimeraCore
